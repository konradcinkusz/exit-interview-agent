# Secret scanner configuration (REPO-BASELINE §2, P5). Extends the default ruleset.
title = "exit-interview-agent gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented dev-only placeholders; none of these is a credential."
regexes = [
  '''dev-only-[a-z0-9-]*''',
  '''REPLACE_ME''',
  '''example\.invalid''',
]
paths = [
  '''pnpm-lock\.yaml''',
  # Provider tests plant deliberately fake keys ("sk-..." strings) as canaries to prove they never reach a log, span or error.
  '''tests/ExitInterviewAgent\.Providers\.Tests/.*''',
  '''tests/ExitInterviewAgent\.Cli\.Tests/.*''',
]
