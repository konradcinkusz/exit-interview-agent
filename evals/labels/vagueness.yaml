pairs:
  - earlier: "My manager was great, really good, you know, generally fine."
    later: "Honestly there was no support at all, and decisions were chaotic and unfair, and nobody explained anything."
    label: contradiction
    rationale: "Praise followed by 'no support at all' about the same subject."
  - earlier: "The team was friendly and everyone helped each other."
    later: "Nobody ever helped me and the team was cold and unfriendly."
    label: contradiction
    rationale: "Opposite claims about the same thing."
  - earlier: "Pay was generous and always on time."
    later: "I was underpaid and the raise never came."
    label: contradiction
    rationale: "Opposite claims about pay."
  - earlier: "Training was good and I used my 1500 euro budget."
    later: "There was no training at all."
    label: contradiction
    rationale: "Direct reversal."
  - earlier: "Management was terrible, nothing worked."
    later: "Actually the manager was great and very supportive."
    label: contradiction
    rationale: "Direct reversal."
  - earlier: "The culture was toxic and unfair."
    later: "People were respectful and welcoming."
    label: contradiction
    rationale: "Opposite claims about culture."
  - earlier: "Promotions were clear and fair."
    later: "I could never get a straight answer about promotion and it felt unfair."
    label: contradiction
    rationale: "Opposite claims about promotions."
  - earlier: "The workload was reasonable."
    later: "I was constantly overworked and burned out."
    label: contradiction
    rationale: "Opposite claims; the first uses no polarity word from the usual lists."
  - earlier: "My manager gave useful feedback."
    later: "My manager never gave any feedback."
    label: contradiction
    rationale: "Direct reversal; the first uses no polarity word from the usual lists."
  - earlier: "My manager was supportive and clear."
    later: "She was supportive but the priorities changed every two weeks."
    label: consistent
    rationale: "The second adds a limitation; it does not retract the first."
  - earlier: "The onboarding was chaotic."
    later: "On day one my laptop was missing and nobody knew I was starting."
    label: consistent
    rationale: "The second illustrates the first."
  - earlier: "I loved working there."
    later: "I hated the evening messages but loved the people."
    label: consistent
    rationale: "A nuance, not a reversal."
  - earlier: "Benefits were decent."
    later: "The salary matched the offer."
    label: consistent
    rationale: "Compatible claims about different aspects."
  - earlier: "It was okay."
    later: "It was fine."
    label: consistent
    rationale: "The same claim."
  - earlier: "The workload was heavy and I was overworked."
    later: "We were often overworked during releases."
    label: consistent
    rationale: "The second narrows the first."
  - earlier: "I could not see a path to a senior role."
    later: "Nobody could tell me what the next level required."
    label: consistent
    rationale: "The second explains the first."
