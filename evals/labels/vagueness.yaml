  - text: "There was a policy that every deploy needed two approvals, and during an incident last winter that rule delayed a fix by hours."
    label: specific
    rationale: "A named rule and a dated incident."
  - text: "It was okay but the office had no windows and the desks were shared between three people."
    label: specific
    rationale: "Concrete conditions (no windows, three people per desk) despite the cue word 'okay'."
  - text: "Nothing really, it was fine in general."
    label: vague
