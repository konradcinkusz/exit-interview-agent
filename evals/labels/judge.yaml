# Hand labels for the Layer 2 judge (docs/eval/SPEC.md §5, §9). Synthetic questions and replies only.
#
# WHO LABELLED: the AI session that wrote the harness, by reading each item against the anchors in evals/rubrics/judge.yaml, before any judge ran.
# That makes this an AUTHOR-LABELLED, NON-HUMAN set: a rehearsal of the calibration protocol, not a calibration (ai-evals §5). It exercises the protocol
# end to end and can find rubric defects cheaply; it cannot discharge the rule, which says 'against humans'. The same author wrote the rubric and the
# labels, so agreement with them is partly agreement with the author's own reading. The judge gate stays shut until labels with labeller_kind: human
# exist under the owner's handle (evals/rubrics/judge.yaml, calibration.owner_handle).
#
# Level 0, 1 and 2 are the anchors of the criterion. Questions marked 'the protocol's own wording' are the questions the agent actually asks.
version: 1.0.0
labeller: author-ai
labeller_kind: ai-author
provenance: >-
  Written by the author of the harness (an AI session) from the anchors; no judge output and no rule output was consulted while labelling.
