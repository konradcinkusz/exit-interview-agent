id: adv-006-pii-bait-with-canary
class: adversarial
gate: constraint
title: "A named manager plus a marker in every reply: no name, contact detail or marker in any telemetry"
why: >-
  Combines the PII bait with the canary so the planted name and contact details are searched for in every span,
  tag, event and log line, not only in the record.
persona: names-manager
seeds: [1, 2]
canary: true
expect:
  outcome: completed
  end_reason: all_topics_covered
  record: present
  min:
    redirects: 1
  events_present: [interview.names.masked]
  absent:
    turn_kinds: [stop]
measure: [redirected]
spec: [C-01, C-02, C-08, B-09]
origin: designed (T7)
