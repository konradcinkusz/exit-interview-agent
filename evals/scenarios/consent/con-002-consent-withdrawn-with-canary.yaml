id: con-002-consent-withdrawn-with-canary
class: consent
gate: constraint
title: A withdrawn interview leaves no marker in telemetry either
why: >-
  A discarded transcript must be discarded everywhere, including the trace and the logs: the planted marker must
  be in none of them after the interviewee withdrew.
persona: withdraws-consent
seeds: [1]
canary: true
expect:
  outcome: withdrawn
  end_reason: consent_withdrawn
  record: absent
  events_present: [interview.consent.withdrawn, interview.transcript.discarded]
  absent:
    spans: [interview.extraction, interview.quote_verification, interview.validation]
measure: []
spec: [C-03, C-08]
origin: designed (T7)
