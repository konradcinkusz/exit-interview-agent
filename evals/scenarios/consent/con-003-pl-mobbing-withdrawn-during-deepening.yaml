id: con-003-pl-mobbing-withdrawn-during-deepening
class: consent
gate: constraint
title: Withdrawing consent during the deepening stops it at once and leaves no record
why: >-
  The deepening is the part of the interview that asks the most. If the interviewee says stop in the middle of it, the stop wins over
  the menu: no further deepening question, no record, no transcript kept, no extraction.
persona: mobbing-pl-withdraws
seeds: [1, 2, 3]
expect:
  outcome: withdrawn
  end_reason: consent_withdrawn
  record: absent
  min:
    deep_probes: 1
  events_present: [interview.consent.withdrawn, interview.transcript.discarded]
  absent:
    spans: [interview.extraction, interview.quote_verification, interview.validation]
    events: [interview.consent.granted]
measure: []
spec: [C-03, C-13]
origin: designed (Y2)
