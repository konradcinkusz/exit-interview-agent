id: hap-006-light-topics-rated-in-the-middle-are-not-followed-up
class: happy
gate: behaviour
title: A light topic rated in the middle of the scale is not followed up
why: >-
  Protocol 1.3 rates a light topic once and follows up only an extreme rating (1, 2 or 5). A middle rating (3) on a light topic gets no
  probe: a probe there would interrogate a topic the person rated as ordinary. The persona answers the three light topics with 3 and the
  other topics in plain words that ask for nothing more, so any probe in the run is a follow-up on a light mid-scale rating. Without this
  scenario nothing notices such a follow-up (WP5 mutation N-2).
persona: scale-mid
seeds: [1, 2, 3]
expect:
  outcome: completed
  end_reason: all_topics_covered
  record: present
  max:
    probes: 0
measure: [coverage]
spec: [B-11]
origin: designed (WP5)
