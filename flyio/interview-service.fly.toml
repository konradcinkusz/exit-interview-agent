# GENERATED TOPOLOGY, NEVER TRIGGERED in this phase (PROJECT-BRIEF §2: no deployment of any kind).
app = "exit-interview-agent-interview-service-dev"
primary_region = "fra"

[build]
  # Both paths are relative to THIS FILE. The context is the repository root: the Dockerfile
  # copies src/ExitInterviewAgent.* and the root build props.
  dockerfile = "../src/ExitInterviewAgent.InterviewService/Dockerfile"
  context = ".."

[env]
  # Public configuration only. Secrets (ConnectionStrings__interviewdb) are Fly secrets.
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  DATABASE_PROVIDER = "PostgreSQL"
  # The issuer URL is public by necessity: it is where every validator fetches the JWKS from.
  Jwt__Authority = "https://exit-interview-agent-authservice-dev.fly.dev"
  Jwt__Issuer = "ExitInterviewAgent"
  Jwt__Audience = "ExitInterviewAgent"
  # MCP resource server (ADR-0012): the issuer is authservice's Jwt__PublicBaseUrl, the resource is this app's MCP URL.
  Mcp__Issuer = "https://exit-interview-agent-authservice-dev.fly.dev"
  Mcp__Resource = "https://exit-interview-agent-interview-service-dev.fly.dev/mcp"

  # Hosted interview (web-app-plan §2-§4, ADR-0076..0078). Public values only, equal to the production defaults in
  # appsettings.Production.json, written here so the posture is visible in `fly config show`. NO secret goes in this file.
  Interviews__RequireCredit = "true"
  Interviews__RequireVerifiedEmail = "true"   # fail closed: starts are refused until authservice emits email_verified
  Interviews__MaxStartsPerDay = "20"
  Billing__WebhookTolerance = "00:05:00"
  # Set by the OWNER with `fly secrets set` (flyio/SECRETS.md, docs/runbooks/web-app-deploy.md), never here:
  #   Interviews__Enabled            the emergency switch; "false" refuses new interviews (kill switch)
  #   Interviews__Provider           provider id, e.g. "anthropic"; unset = the service answers 503
  #   Interviews__Model              model id chosen after the W9 real-model run
  #   <Interviews__ApiKeyEnv value>  the NAME of the variable holding the provider key (default ANTHROPIC_API_KEY); the key is a secret
  #   Billing__Provider = "stripe", Billing__StripeSecretKey, Billing__StripeWebhookSecret, Billing__StripePriceId
  #   Billing__PriceMinorUnits, Billing__Currency    price: a decision after W9, no default in code
  #   Billing__SuccessUrl, Billing__CancelUrl        the public web app's return pages (owner's domain)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1, not 0: the web app's server side calls this service in-request (the BFF proxy, GET /api/v1/me).
  # A cold start here is a failed call, not a slow page.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"   # .NET cold start + first-boot schema migration

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
